<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>药品使用说明</title>
    <style>
        :root {
            --primary-color: #009A97;
            --warning-orange: #E89310;
            --error-red: #E74C3C;
            --bg-color: #F5F7FA;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-secondary: #666666;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            max-width: 900px;
            margin: 0 auto;
        }

        .page-title {
            text-align: center;
            color: var(--primary-color);
            margin: 20px 0 30px 0;
            font-size: 2.2em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.05);
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 24px;
            margin-bottom: 24px;
            transition: transform 0.2s;
        }

        .item-name {
            font-size: 1.8em;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0 0 15px 0;
            line-height: 1.2;
        }

        .item-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 1.1em;
            color: var(--text-secondary);
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .meta-item {
            display: flex;
            align-items: center;
        }

        .warning-orange {
            color: var(--warning-orange);
            font-weight: 600;
        }

        .warning-red {
            color: var(--error-red);
            font-weight: 600;
        }

        h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 8px;
            margin-top: 30px;
            font-size: 1.4em;
            display: flex;
            align-items: center;
        }

        h2::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 24px;
            background: var(--primary-color);
            margin-right: 10px;
            border-radius: 2px;
        }

        p {
            margin: 12px 0;
            text-align: justify;
            color: #444;
        }

        ol {
            margin: 12px 0;
            padding-left: 25px;
        }

        li {
            margin-bottom: 8px;
        }

        .note {
            background-color: #FFF9E6;
            border-left: 5px solid var(--warning-orange);
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            font-style: italic;
        }

        #content {
            min-height: 200px;
        }

        #loading {
            text-align: center;
            margin-top: 100px;
            font-size: 1.2em;
            color: var(--secondary-color);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        #error {
            background: #FFEBEE;
            color: #C62828;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-top: 50px;
            border: 1px solid #FFCDD2;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .item-name {
                font-size: 1.6em;
            }

            .item-meta {
                display: flex;
                font-size: 0.95em;
                justify-content: space-between;
            }

            .item-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <div id="content">
        <div id="loading">正在为您获取药品信息...</div>
    </div>

    <script>
        function formatDate(dateStr) {
            if (!dateStr) return '无';
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return dateStr;
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function checkExpireWarning(dateStr) {
            if (!dateStr) return false;
            const expireDate = new Date(dateStr);
            const today = new Date();
            const diffTime = expireDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays < 30;
        }

        function parseDrugInfo(text) {
            if (!text) return '<p>暂无使用说明内容。</p>';
            const sections = text.split(/【([^】]+)】/g).filter(Boolean);
            let html = '';

            for (let i = 0; i < sections.length; i += 2) {
                if (i + 1 < sections.length) {
                    const title = sections[i].trim();
                    const content = sections[i + 1].trim();

                    html += `<h2>${title}</h2>`;

                    if (content.match(/[\uFF08(]\d+[\uFF09)]/g)) {
                        const items = content.split(/；\s*(?=[\uFF08(]\d+[\uFF09)])/).map(item => item.trim().replace(/^[\uFF08(]\d+[\uFF09)]/, ''));
                        html += '<ol>';
                        items.forEach(item => {
                            html += `<li>${item.replace(/；$/, '').replace(/。$/, '')}</li>`;
                        });
                        html += '</ol>';
                    } else {
                        const paragraphs = content.split(/。/g).filter(Boolean);
                        paragraphs.forEach(para => {
                            const trimmedPara = para.trim() + '。';
                            if (trimmedPara.includes('患者对本药的个体差异很大')) {
                                html += `<div class="note"><p>${trimmedPara}</p></div>`;
                            } else {
                                html += `<p>${trimmedPara}</p>`;
                            }
                        });
                    }
                }
            }
            return html || `<p>${text}</p>`;
        }

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        window.onload = function () {
            const code = getQueryParam('code');
            const contentDiv = document.getElementById('content');

            if (!code) {
                contentDiv.innerHTML = `<h1 class="page-title">药品使用说明</h1> <div id="error">药品数据为空</div>`;
                return;
            }

            const apiUrl = `https://www.gdssbh.com/cmfv2/api/ssbh/Item/Remark?combinedId=${encodeURIComponent(code.replace('379630044868680', '386908427251781'))}`;

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) throw new Error('服务器响应异常 (' + response.status + ')');
                    return response.json();
                })
                .then(res => {
                    if (!res.status) {
                        throw new Error(res.message || '获取数据失败');
                    }

                    const data = res.data;
                    if (!data || !data.name || data.name === '') {
                        throw new Error(res.message || '药品数据为空');
                    }
                    const stockWarnClass = (data.availableStock <= 0) ? 'warning-orange' : '';
                    const isExpWarn = checkExpireWarning(data.latestExpirationDate);
                    const expireWarnClass = isExpWarn ? 'warning-red' : '';

                    const headerHtml = `
                        <h1 class="page-title">药品使用说明</h1>
                        <div class="item-card">
                            <h2 class="item-name">${data.name || '未知药品'}</h2>
                            <div class="item-meta">
                                <div class="meta-item">规格：${data.form || '-'}</div>
                                <div class="meta-item">余量：<span class="${stockWarnClass}">${data.availableStock ?? 0}</span> ${data.unit || '件'}</div>
                                <div class="meta-item">过期日期：<span class="${expireWarnClass}">${formatDate(data.latestExpirationDate)}</span></div>
                            </div>
                            <div class="instruction-body">
                                ${parseDrugInfo(data.remark)}
                            </div>
                        </div>
                    `;

                    contentDiv.innerHTML = headerHtml;
                })
                .catch(error => {
                    contentDiv.innerHTML = `<h1 class="page-title">药品使用说明</h1> <div id="error">${error.message}</div>`;
                });
        };
    </script>
</body>

</html>
